# Every Flutter project has one of these. It names your app, sets the Dart
# version it needs, and lists the packages you depend on.
# Add a package with: flutter pub add <name>
name: asan
description: My 6ADET final project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  material_symbols_icons: ^4.2960.0
  # Lets you preview the app inside a phone frame while you develop in a
  # browser. It is switched off automatically in a release build.
  device_preview: ^1.3.1
  image_picker: ^1.2.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - env.json
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: docs/assets/fonts/BricolageGrotesque-Regular.ttf
          weight: 400
        - asset: docs/assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
