name: Deploy web demo

# Builds the Flutter web app and publishes it to GitHub Pages on every push to
# main, so the link in your README is always your latest commit.
#
# Before this works, turn Pages on once: repository Settings > Pages >
# Build and deployment > Source: GitHub Actions.
#
# CONFIG AND SECRETS. Values compiled into a web build are readable by anyone who
# visits the site, so it matters which kind you are shipping:
#
#   Safe to ship: project identifiers whose data is protected by rules, i.e. the
#   Firebase config in firebase_options.dart and the Supabase URL plus publishable
#   key. Both vendors document these as safe to expose in a client. Your Firestore
#   rules and your Supabase RLS policies are what actually protect the data.
#
#   NOT safe to ship: anything billable or privileged. A Gemini API key, a
#   Supabase secret (service_role) key, a service account JSON. A stranger can
#   read these off your deployed site and spend your quota. Keep those features
#   local and demo them on video, or put a server in front.
#
# Whatever you do pass in, put it in Settings > Secrets and variables > Actions
# and reference it below. Never write a key literally in this file: it is public.
#
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Create local Supabase config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python -c 'import json, os; open("env.json", "w").write(json.dumps({"SUPABASE_URL": os.environ["SUPABASE_URL"], "SUPABASE_PUBLISHABLE_KEY": os.environ["SUPABASE_PUBLISHABLE_KEY"]}))'

      - run: flutter pub get

      # Report analyzer and test issues without blocking the demo deployment.
      - run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - run: flutter test
        continue-on-error: true

      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        # --base-href matters: on a project page the site lives at
        # username.github.io/<repo>/, and without it every asset 404s and you get
        # a white screen.
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web

  deploy:
    needs: build
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
